# CB-7I.C — NGINX burst shield (looser than app limits)
# conf.d is included inside http {} via nginx.conf, so these directives are in http-context.

limit_req_status 429;
limit_req_log_level warn;

limit_req_zone $binary_remote_addr zone=rl_signup_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rl_pwreset_ip:10m rate=10r/s;
